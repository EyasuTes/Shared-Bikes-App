services:
  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://server:5000
    depends_on:
      - server

  server:
    build:
      context: ./server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      db-schema:
        condition: service_completed_successfully

  db:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/bikeshare_schema.sql:/docker-entrypoint-initdb.d/001-bikeshare-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  db-schema:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database/bikeshare_schema.sql:/schema/bikeshare_schema.sql:ro
    command:
      - psql
      - -h
      - db
      - -U
      - ${POSTGRES_USER}
      - -d
      - ${POSTGRES_DB}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /schema/bikeshare_schema.sql
    restart: "no"

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ETL_ARTIFACT_DIR: /opt/airflow/etl-artifacts
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - airflow_data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags:ro

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:19092
        --create
        --if-not-exists
        --topic station-status
        --partitions 3
        --replication-factor 1
    restart: "no"

  station-producer:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_STATION_STATUS_TOPIC: station-status
      GBFS_POLL_SECONDS: ${GBFS_POLL_SECONDS:-60}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  alert-consumer:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    command: ["python", "-m", "streaming.alert_consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_STATION_STATUS_TOPIC: station-status
      KAFKA_ALERT_CONSUMER_GROUP: station-depletion-alerts-v1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-schema:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_data:
  kafka_data:
